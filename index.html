<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MajorLeagueDuck {An Untitled Duck Game}</title>
    <script type="module" src="GameManager.js"></script>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
<!-- <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet"> -->
<link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <h1>Major</h1>
        <h1>League</h1>
        <h1>Duck{game}</h1> 
        <body>{An Untiltled Duck Game} by:function()</body> 
    </header>
    <main>
        <section id="playArea">
            <div id="playerimg"></div>
            <div id="enemyimg"></div>
            <button type="button">Continue</button>
        </section>
        <section id="commandArea">
            <div id="terminal">
                <p id="prevInput"></p>
                <button type="button" id="attackbtn">BruteForce</button>
                <button type="button" id="healbtn">Snapshot</button>
                <button type="button" id="attdebuffbtn">firewall-cmd</button>
                <button type="button" id="defdebuffbtn">ping 127.0.0.1</button>
                <button type="button" id="exitbtn">exit</button>

                

            </div>
            
        </section>
    </main>
    <footer></footer>
</body>
</html>
