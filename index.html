<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MajorLeagueDuck {An Untitled Duck Game}</title>
    <script type="module" src="GameManager.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MajorLeagueDuck {An Untitled Duck Game}</h1>
    </header>
    <main>
        <section id="playArea">
            <div id="playerimg"></div>
            <div id="enemyimg"></div>
            <button type="button">Continue</button>
        </section>
        <section id="commandArea">
            <div id="terminal">
                <p id="prevInput"></p>
                <input type="text" id="cmdLine">
                <button type="button" id="submitLine">Submit Line</button>
            </div>
            
        </section>
    </main>
    <footer></footer>
</body>
</html>
