<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MajorLeagueDuck {An Untitled Duck Game}</title>
    <script type="module" src="GameManager.js"></script>
    <link rel="stylesheet" href="style.css">
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1>Major</h1>
        <h1>League</h1>
        <h1>Duck{game}</h1> 
        <body>{An Untiltled Duck Game} by:function()</body> 
    </header>
    <main>
        <section id="playArea">
            <div id="playerimg"></div>
            <div id="enemyimg"></div>
            <button type="button">Continue</button>
        </section>
        <section id="commandArea">
            <div id="terminal">
                <p id="prevInput"></p>
                <input type="text" id="cmdLine">
                <button type="button" id="submitLine">Submit Line</button>
            </div>
            
        </section>
    </main>
    <footer></footer>
</body>
</html>
